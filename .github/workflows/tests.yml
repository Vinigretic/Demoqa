name: UI + API tests (Remote Selenium) + Allure Report

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ui-tests:
    name: UI tests (Remote Selenium)
    runs-on: ubuntu-latest

    services:
      selenium:
        image: selenium/standalone-chrome:latest
        ports:
          - 4444:4444
        options: >-
          --shm-size=2g
          --health-cmd="curl -f http://localhost:4444/status || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=15s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv & install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run UI tests and collect allure results
        env:
          SELENIUM_REMOTE_URL: http://localhost:4444/wd/hub
          HEADLESS: "true"
        run: |
          . .venv/bin/activate
          pytest tests/ui/test_forms.py --alluredir=allure-results-ui

      - name: Upload allure-results (UI)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui
          path: allure-results-ui
          if-no-files-found: ignore

  report-and-deploy:
    name: Build Allure HTML + Deploy to GitHub Pages
    if: always()
    needs: [ ui-tests ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout gh-pages (for history)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download allure-results (UI)
        uses: actions/download-artifact@v4
        with:
          name: allure-results-ui
          path: _artifacts/allure-results-ui
        continue-on-error: true

      - name: Merge allure results
        run: |
          mkdir -p allure-results
          cp -R _artifacts/allure-results-ui/. allure-results/ || true
          ls -la allure-results || true

      - name: Generate Allure report
        uses: andgineer/allure-report@v3.6
        id: allure-report
        if: always()
        with:
          allure-results: allure-results
          website: gh-pages
          reports-site-path: builds/ui
          max-reports: 20

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ always() && steps.allure-report.outcome == 'success' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: gh-pages
          keep_files: true

    environment:
      name: allure-report
      url: ${{ steps.allure-report.outputs.report-url }}

